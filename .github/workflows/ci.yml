name: ci

on:
  pull_request:
    branches:
      - main
      - 'release-*'
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions: {}

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Only reads for checkout; gh-pages push and PR comment use the platform-mesh-publisher app token
      pull-requests: write # pr-preview-action posts the preview link comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm

      - id: set-version
        name: Set documentation version
        run: echo "version=" >> $GITHUB_OUTPUT

      - run: npm ci
      - run: npm test
      - name: Lint install.sh
        run: shellcheck install.sh
      - run: npm run build
        env:
          DOCS_VERSION: ${{ steps.set-version.outputs.version }}
          PAGES_BASE: ${{ format('pr-preview/pr-{0}', github.event.pull_request.number) }}
